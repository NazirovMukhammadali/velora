name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --runInBand

      - name: Integration e2e (mongo-memory)
        env:
          SECRET_TOKEN: ci-secret-token
          RUN_MONGO_MEMORY_TESTS: true
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/velora_ci_test
        run: npm run test:integration
        timeout-minutes: 10
