name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --runInBand

      - name: Integration e2e (mongo-memory)
        env:
          SECRET_TOKEN: ci-secret-token
          RUN_MONGO_MEMORY_TESTS: true
          MONGOMS_VERSION: 7.0.14
          MONGOMS_DISTRO: ubuntu-22.04
        run: npm run test:integration
        timeout-minutes: 10
